apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mysql.name }}
  labels:
    {{- include "ovra-zero.labels" . | nindent 4 }}
spec:
  ports:
    - name: mysql
      port: {{ .Values.mysql.port }}
      targetPort: {{ .Values.mysql.port }}
{{- if .Values.mysql.internal.enabled }}
  selector:
    app.kubernetes.io/component: mysql
    {{- include "ovra-zero.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.mysql.external.enabled }}
{{- if not .Values.mysql.external.ip }}
{{- fail "mysql.external.ip is required when mysql.external.enabled=true" }}
{{- end }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Values.mysql.external.endpointSliceName }}
  labels:
    kubernetes.io/service-name: {{ .Values.mysql.name }}
    {{- include "ovra-zero.labels" . | nindent 4 }}
addressType: IPv4
ports:
  - name: mysql
    protocol: TCP
    port: {{ .Values.mysql.port }}
endpoints:
  - addresses:
      - {{ .Values.mysql.external.ip | quote }}
{{- end }}
{{- if .Values.mysql.internal.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mysql.name }}
  labels:
    app.kubernetes.io/component: mysql
    {{- include "ovra-zero.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mysql
      {{- include "ovra-zero.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mysql
        {{- include "ovra-zero.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.internal.image | quote }}
          imagePullPolicy: {{ .Values.mysql.internal.imagePullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.mysql.internal.rootPassword | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.internal.database | quote }}
          ports:
            - name: mysql
              containerPort: {{ .Values.mysql.port }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            {{- if .Values.mysql.internal.initSqlConfigMap }}
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
            {{- end }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: mysql-data
          emptyDir: {}
        {{- if .Values.mysql.internal.initSqlConfigMap }}
        - name: mysql-init
          configMap:
            name: {{ .Values.mysql.internal.initSqlConfigMap }}
        {{- end }}
{{- end }}
