{{- if .Values.etcd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.etcd.name }}
  labels:
    {{- include "ovra-zero.labels" . | nindent 4 }}
spec:
  ports:
    - name: client
      port: {{ .Values.etcd.port }}
      targetPort: {{ .Values.etcd.port }}
  selector:
    app.kubernetes.io/component: etcd
    {{- include "ovra-zero.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.etcd.headlessServiceName }}
  labels:
    {{- include "ovra-zero.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: client
      port: {{ .Values.etcd.port }}
      targetPort: {{ .Values.etcd.port }}
    - name: peer
      port: {{ .Values.etcd.peerPort }}
      targetPort: {{ .Values.etcd.peerPort }}
  selector:
    app.kubernetes.io/component: etcd
    {{- include "ovra-zero.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.etcd.name }}
  labels:
    app.kubernetes.io/component: etcd
    {{- include "ovra-zero.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.etcd.replicas }}
  podManagementPolicy: Parallel
  serviceName: {{ .Values.etcd.headlessServiceName }}
  selector:
    matchLabels:
      app.kubernetes.io/component: etcd
      {{- include "ovra-zero.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: etcd
        {{- include "ovra-zero.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: etcd
          image: {{ .Values.etcd.image | quote }}
          imagePullPolicy: {{ .Values.etcd.imagePullPolicy }}
          command:
            - etcd
          args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd
            - --listen-client-urls=http://0.0.0.0:{{ .Values.etcd.port }}
            - --advertise-client-urls=http://$(POD_NAME).{{ .Values.etcd.headlessServiceName }}.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.etcd.port }}
            - --listen-peer-urls=http://0.0.0.0:{{ .Values.etcd.peerPort }}
            - --initial-advertise-peer-urls=http://$(POD_NAME).{{ .Values.etcd.headlessServiceName }}.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.etcd.peerPort }}
            - --initial-cluster={{ include "ovra-zero.etcdInitialCluster" . }}
            - --initial-cluster-token={{ .Values.etcd.initialClusterToken }}
            - --initial-cluster-state=new
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: client
              containerPort: {{ .Values.etcd.port }}
            - name: peer
              containerPort: {{ .Values.etcd.peerPort }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
          readinessProbe:
            tcpSocket:
              port: {{ .Values.etcd.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
